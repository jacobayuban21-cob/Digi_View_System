# Server Port (Render injects PORT dynamically; defaults to 8080 for local dev)
server.port=${PORT:8080}

# Supabase PostgreSQL Connection
# Replace with your Supabase Database credentials (Found in Project Settings -> Database)
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://db.YOUR_PROJECT_REF.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:YOUR_SUPABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
# Note: Hibernate 6+ automatically detects PostgreSQLDialect from JDBC metadata
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
